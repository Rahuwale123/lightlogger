name: Bug report
description: Something in lightlogger isn't working as expected
title: "[bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: lightlogger version
      description: Output of `pip show lightlogger`
      placeholder: "0.1.1"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.6"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 14, Ubuntu 22.04, Windows 11, ..."
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal repro (if possible)
      description: A small script that reproduces the issue.
      render: python
    validations:
      required: false
