[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightlogger"
version = "0.1.0"
description = "Live web dashboard for your Python logs. Zero dependencies, two lines of code."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "rahul wale", email = "fthedrive@gmail.com" },
]
keywords = ["logging", "dashboard", "debugging", "developer-tools", "sse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/Rahuwale123/lightlogger"
Repository = "https://github.com/Rahuwale123/lightlogger"
Changelog = "https://github.com/Rahuwale123/lightlogger/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/lightlogger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["lightlogger"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["lightlogger"]
mypy_path = "src"
